name: Sync catalogue from Supabase

# Reads the cloud database (where the studio panel saves), downloads uploaded
# images into assets/uploads/ and rewrites catalogue.json, then commits. The
# public website serves everything from GitHub Pages, so visitors — including
# those in Iran where cloud endpoints may be filtered — never need Supabase.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-catalogue
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull catalogue from Supabase
        run: node scripts/sync-catalogue.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Commit and push if changed
        run: |
          git config user.name "dastin-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A catalogue.json assets/uploads
          if git diff --cached --quiet; then
            echo "Snapshot already up to date — nothing to commit."
          else
            git commit -m "Sync catalogue snapshot from cloud"
            git push
          fi
